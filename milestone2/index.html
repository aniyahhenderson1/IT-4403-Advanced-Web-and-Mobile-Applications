<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Search | IT 4403 Milestone 2</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="milestone2.css">
</head>

<body>
    <header class="site-header">
        <nav aria-label="Main navigation">
            <a href="index.html" class="brand">Book Finder</a>
            <div class="nav-links">
                <a href="index.html" aria-current="page">Home</a>
                <a href="bookshelf.html">My Bookshelf</a>
            </div>
        </nav>
        <div class="page-title">
            <h1>Book Search</h1>
            <p>Search Open Library by keyword, then open a book to see its details.</p>
        </div>
    </header>

    <main>
        <section class="card" aria-labelledby="search-heading">
            <h2 id="search-heading">Find a Book</h2>
            <form id="search-form" class="search-form" role="search">
                <div class="field">
                    <label for="search-input">Search terms</label>
                    <input type="text" id="search-input" name="q" placeholder="e.g. data analysis" autocomplete="off">
                </div>
                <button type="submit" class="btn">Search</button>
            </form>
            <p id="status" class="status" role="status" aria-live="polite"></p>
        </section>

        <section class="card" aria-labelledby="results-heading">
            <h2 id="results-heading" tabindex="-1">Results</h2>
            <p id="summary" class="results-summary"></p>
            <ul id="results" class="book-list"></ul>
            <div id="pagination" class="pagination" hidden>
                <label for="page-select">Page</label>
                <select id="page-select"></select>
                <span id="page-total"></span>
            </div>
        </section>
    </main>

    <footer class="site-footer">
        <p>Book data and covers from <a href="https://openlibrary.org" target="_blank" rel="noopener">Open Library</a>.
        Student project for IT 4403 by Aniyah Henderson. <a href="../index.html">Back to portfolio</a></p>
    </footer>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="js/common.js"></script>
    <script src="js/search.js"></script>
</body>

</html>
