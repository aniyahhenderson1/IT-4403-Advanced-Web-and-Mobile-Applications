<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Book Edition | Milestone 1</title>
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#151a33;--bg:#f4f5fb;--card:#fff;--blue:#3340ff;--sun:#ffc933;--muted:#586079;--line:#dcdff0;--soft:#eef0ff;--head:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;--body:"Source Sans 3","Segoe UI",system-ui,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
body{background:var(--bg);color:var(--ink);font:1.0625rem/1.6 var(--body)}
h1,h2,h3{font-family:var(--head);line-height:1.15}
a{color:var(--blue)}
a:focus-visible{outline:3px solid var(--sun);outline-offset:3px;border-radius:4px}
header{background:var(--ink);color:#fff}
header>*{max-width:1000px;margin-inline:auto;padding-inline:1.5rem}
header nav{display:flex;flex-wrap:wrap;align-items:center;gap:.25rem .5rem;padding-block:1rem}
header nav a{color:#d6d9ff;text-decoration:none;padding:.3rem .8rem;border-radius:999px}
header nav a:hover{background:rgba(255,255,255,.14);color:#fff}
header nav .nav-links{display:flex;flex-wrap:wrap;gap:.25rem;padding:0}
header nav .name{margin-right:auto;padding-left:0;font:800 1.3rem var(--head);color:#fff}
header nav .name:hover{background:none}
header h1{color:#fff;font-size:clamp(2rem,5vw,3rem);font-weight:800;padding-top:1.5rem}
header p{color:#c9cdea;padding-bottom:3rem;margin-top:.5rem}
header code{background:rgba(255,255,255,.14);padding:.05rem .4rem;border-radius:4px}
footer{max-width:1000px;margin:2.5rem auto 2rem;padding-inline:1.5rem;color:var(--muted)}
footer h2{font-size:1rem;margin-bottom:.25rem;color:var(--ink)}
footer p{font-size:.95rem}
main{max-width:1000px;margin:-1.75rem auto 0;padding:0 1.5rem;position:relative}
dl{display:grid;grid-template-columns:max-content 1fr;gap:.35rem 1.25rem}
dt{font-weight:700;color:var(--muted)}
dd{overflow-wrap:anywhere}
.nocover{display:flex;align-items:center;justify-content:center;background:var(--soft);color:var(--muted);text-align:center;font-size:.9rem;border-left:8px solid var(--blue)}
.error{background:#fff0ef;border:1px solid #e2a29b;padding:1rem 1.25rem;border-radius:10px}
.book{display:grid;grid-template-columns:260px 1fr;gap:2rem;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:1.75rem}
.book img{width:100%;height:auto;border-left:8px solid var(--blue);border-radius:4px}
.book .nocover{height:340px}
.book h2{font-size:1.2rem;margin:1.5rem 0 .5rem}
.tags{display:flex;flex-wrap:wrap;gap:.4rem;list-style:none}
.tags li{background:var(--soft);color:#2430c9;padding:.15rem .7rem;border-radius:999px;font-size:.9rem}
blockquote{margin:.5rem 0;padding-left:1rem;border-left:4px solid var(--sun);font-family:var(--head);font-size:1.1rem}
@media(max-width:700px){.book{grid-template-columns:1fr}.book img{max-width:240px}}
</style>
</head>
<body>
<header>
  <nav aria-label="Main navigation">
    <a href="index.html" class="name">Aniyah Henderson</a>
    <div class="nav-links">
      <a href="index.html">Home</a>
      <a href="index.html#lab-work">Lab Work</a>
      <a href="index.html#milestones">Individual Project Milestone</a>
    </div>
  </nav>
  <h1>Book Edition Record</h1>
  <p>Details loaded from <code>openlibrary-book.json</code>.</p>
</header>
<main id="content" aria-live="polite"><p>Loading book information...</p></main>
<footer><p><a href="index.html">Back to project home</a> &nbsp;|&nbsp; <a href="search.html">View the search results page</a></p></footer>

<script>
$(function () {
  var NA = "Not available";
  function esc(s) { return $("<div>").text(s == null ? "" : s).html(); }
  function list(a) { return $.isArray(a) && a.length ? a : null; }
  function textOf(v) {            // handles strings and {type,value} objects
    if (v == null) return null;
    return typeof v === "object" ? (v.value || null) : String(v);
  }
  function row(label, html) { return "<dt>" + label + "</dt><dd>" + (html || NA) + "</dd>"; }
  function joinEsc(a) { return list(a) ? $.map(a, esc).join(", ") : null; }
  function olLink(path, label) {
    return '<a href="https://openlibrary.org' + esc(path) + '" target="_blank" rel="noopener">' + esc(label) + "</a>";
  }

  $.getJSON("openlibrary-book.json")
    .done(function (b) {
      var covers = list(b.covers) ? $.grep(b.covers, function (c) { return c > 0; }) : [];
      var cover = covers.length ? covers[0] : null;
      var title = b.title || "Untitled";
      var html = '<article class="book"><div>';

      if (cover) {
        html += '<img src="https://covers.openlibrary.org/b/id/' + cover + '-L.jpg" alt="Cover of ' + esc(title) + '">';
      } else {
        html += '<div class="nocover" role="img" aria-label="No cover available for ' + esc(title) + '">No cover</div>';
      }
      html += "</div><div><h2 style='margin-top:0;font-size:1.6rem'>" + esc(title) + "</h2>";
      if (b.subtitle) html += "<p>" + esc(b.subtitle) + "</p>";

      var first = textOf(b.first_sentence);
      if (first) html += "<blockquote>" + esc(first) + "</blockquote>";

      html += "<h2>Publication details</h2><dl>";
      html += row("Publisher", joinEsc(b.publishers));
      html += row("Published", esc(b.publish_date));
      html += row("Pages", esc(b.number_of_pages));
      html += row("Format", esc(b.physical_format));
      html += row("ISBN-10", joinEsc(b.isbn_10));
      html += row("ISBN-13", joinEsc(b.isbn_13));
      html += row("Edition name", esc(b.edition_name));
      html += row("Languages", list(b.languages) ? $.map(b.languages, function (l) { return esc((l.key || "").replace("/languages/", "")); }).join(", ") : null);
      html += row("Publish places", joinEsc(b.publish_places));
      html += row("Dimensions", esc(b.physical_dimensions));
      html += row("Weight", esc(b.weight));
      html += row("Classification (Dewey)", joinEsc(b.dewey_decimal_class));
      html += row("Library of Congress", joinEsc(b.lc_classifications));
      html += row("Contributors", joinEsc(b.contributions));
      html += row("Revision", esc(b.revision));
      html += row("Last modified", b.last_modified ? esc(textOf(b.last_modified).slice(0, 10)) : null);
      html += row("Record created", b.created ? esc(textOf(b.created).slice(0, 10)) : null);
      html += "</dl>";

      html += "<h2>Authors and works</h2><dl>";
      var authors = list(b.authors) ? $.map(b.authors, function (a) { return olLink(a.key, "Author record " + a.key.replace("/authors/", "")); }) : null;
      html += row("Author", authors ? authors.join(", ") : null);
      var works = list(b.works) ? $.map(b.works, function (w) { return olLink(w.key, "Work record " + w.key.replace("/works/", "")); }) : null;
      html += row("Work", works ? works.join(", ") : null);
      html += "</dl>";

      if (list(b.subjects)) {
        html += "<h2>Subjects</h2><ul class='tags'>";
        $.each(b.subjects, function (i, s) { html += "<li>" + esc(s) + "</li>"; });
        html += "</ul>";
      }

      if (covers.length > 1) {
        html += "<h2>Cover identifiers</h2><p>" + covers.join(", ") + "</p>";
      }

      var ids = b.identifiers || {};
      html += "<h2>Other identifiers</h2><dl>";
      html += row("Goodreads", joinEsc(ids.goodreads));
      html += row("LibraryThing", joinEsc(ids.librarything));
      html += row("Internet Archive", b.ocaid ? '<a href="https://archive.org/details/' + esc(b.ocaid) + '" target="_blank" rel="noopener">Borrow or read on Internet Archive</a>' : null);
      html += "</dl>";

      html += "<h2>Open Library</h2><p>" + (b.key ? olLink(b.key, "View this edition on Open Library") : NA) + "</p>";
      html += "</div></article>";
      $("#content").html(html);
      document.title = title + " | Milestone 1";
    })
    .fail(function () {
      $("#content").html('<div class="error"><strong>Could not load the book data.</strong> Check that <code>openlibrary-book.json</code> is in the same folder as this page, and open the page through GitHub Pages or a local server rather than by double-clicking the file.</div>');
    });
});
</script>
</body>
</html>
